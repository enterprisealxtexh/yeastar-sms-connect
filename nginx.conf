# ============================================================
#  Nginx config for calls.nosteq.co.ke
# ============================================================
#
#  DEPLOY STEPS (run on server):
#    sudo cp nginx.conf /etc/nginx/sites-available/calls.nosteq.co.ke
#    sudo ln -sf /etc/nginx/sites-available/calls.nosteq.co.ke /etc/nginx/sites-enabled/calls.nosteq.co.ke
#    sudo nginx -t && sudo systemctl reload nginx
#
#  SSL is managed by Let's Encrypt (certbot).
#  Run once: sudo certbot --nginx -d calls.nosteq.co.ke
# ============================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name calls.nosteq.co.ke;

    # Allow certbot ACME challenges through
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name calls.nosteq.co.ke;

    # SSL — managed by certbot (paths auto-filled after certbot run)
    ssl_certificate     /etc/letsencrypt/live/calls.nosteq.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calls.nosteq.co.ke/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --------------------------------------------------------
    # Security headers
    # --------------------------------------------------------
    add_header X-Frame-Options           DENY                              always;
    add_header X-Content-Type-Options    nosniff                           always;
    add_header X-XSS-Protection          "1; mode=block"                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --------------------------------------------------------
    # Root / — redirect to main company website
    # --------------------------------------------------------
    location = / {
        return 301 https://nosteq.co.ke;
    }

    # --------------------------------------------------------
    # /admin — Yeastar SMS Connect React SPA
    # --------------------------------------------------------
    # Redirect /admin (no slash) → /admin/ for consistency
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /opt/yeastar-sms-connect/dist/;
        index index.html;

        # Try the exact file first (assets, chunks), fall back to SPA index
        # for client-side React Router routes (e.g. /admin/auth, /admin/config)
        try_files $uri $uri/ @admin_spa;

        # Cache static assets (JS/CSS bundles have content-hash names)
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico|webp)$ {
            alias /opt/yeastar-sms-connect/dist/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # Named fallback for React Router — serves index.html for unknown paths
    location @admin_spa {
        root /opt/yeastar-sms-connect/dist;
        rewrite ^ /index.html break;
    }

    # --------------------------------------------------------
    # /api — Proxy to local Node.js API server (port 2003)
    # --------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:2003;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Disable buffering for SSE / real-time endpoints if needed
        proxy_buffering    off;
    }

    # --------------------------------------------------------
    # Deny access to hidden files (.env, .git, etc.)
    # --------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
